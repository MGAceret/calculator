<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <!-- Display of the Calculator -->
        <div id="display"></div>
        <!-- Buttons (Numbers and Operations) -->
        <!-- First Row -->
        <div class="row">
            <button class="clear">AC</button>
            <button class="operator">( )</button>
            <button class="operator">&percnt;</button>
            <button class="operator">&div;</button>
        </div>

        <!-- Second Row -->
        <div class="row">
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator">&times;</button>
        </div>

        <!-- Third Row -->
        <div class="row">
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator">&minus;</button>
        </div>

        <!-- Fourth Row -->
        <div class="row">
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="operator">&plus;</button>
        </div>

        <!-- Fifth Row -->
        <div class="row">
            <button class="number">0</button>
            <button class="decimal">&middot;</button>
            <button class="backspace">&leftarrow;</button>
            <button class="equal" onclick="equals()">&equals;</button>
        </div>
    </div>
    <script src="script/script.js"></script>
</body>
</html>
