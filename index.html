<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <script src="script/script.js"></script>
    <title>Calculator</title>
</head>
<body>
    <div>
        <!-- Display of the Calculator -->
        <div id="display"></div>
        <!-- Buttons (Numbers and Operations) -->
        <!-- First Row -->
        <div>
            <button>AC</button>
            <button>()</button>
            <button>&percnt;</button>
            <button>&div;</button>
        </div>

        <!-- Second Row -->
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>&times;</button>
        </div>

        <!-- Third Row -->
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>&minus;</button>
        </div>

        <!-- Fourth Row -->
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>&plus;</button>
        </div>

        <!-- Fifth Row -->
        <div>
            <button>0</button>
            <button>&middot;</button>
            <button>&leftarrow;</button>
            <button>&equals;</button>
        </div>
    </div>
</body>
</html>
